schema_version = "1.3"

[task]
name = "paper-docx/field-safe-edit-and-authoring"
description = "Finish the report's reference fields"

[agent]
timeout_sec = 3600.0
network_mode = "public"
user = "agent"

[verifier]
timeout_sec = 900.0
network_mode = "public"
user = "root"

[verifier.env]
HTTP_PROXY = "http://127.0.0.1:9"
HTTPS_PROXY = "http://127.0.0.1:9"
ALL_PROXY = "http://127.0.0.1:9"
NO_PROXY = "localhost,127.0.0.1"

[environment]
workdir = "/app"
network_mode = "public"
build_timeout_sec = 1800.0
